name: build-php74-ext-image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/rooqs/php74-alpine-ext
  IMAGE_TAG: 7.4.33-fpm-alpine3.16-ext

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BASE=rooqs/php74-alpine:7.4.33-fpm-alpine3.16-cve2026-109618
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
